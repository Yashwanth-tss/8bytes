name: Test on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - 'three-tier-web-app/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup python3
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install API dependencies
        working-directory: three-tier-web-app/api
        run: |
          pip install -r requirements.txt

      - name: Install Frontend dependencies
        working-directory: three-tier-web-app/app
        run: |
          pip install -r requirements.txt

      - name: Run API Unit Tests
        working-directory: three-tier-web-app/api
        run: |
          python -m unittest discover -s . -p "test_*.py"

      - name: Run Frontend Unit Tests
        working-directory: three-tier-web-app/app
        run: |
          python -m unittest discover -s . -p "test_*.py"

      - name: Send email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.EMAIL_SERVER }}
          server_port: ${{ secrets.EMAIL_PORT }}
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "GitHub Actions Failure: ${{ github.workflow }} (#${{ github.run_number }})"
          to: ${{ secrets.EMAIL_RECIPIENT }}
          from: "GitHub Actions <${{ secrets.EMAIL_USERNAME }}>"
          body: |
            Workflow "${{ github.workflow }}" failed in run #${{ github.run_number }}.
            
            Branch: ${{ github.head_ref || github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            
            View run details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
